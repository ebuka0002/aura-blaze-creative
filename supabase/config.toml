
[functions.newsletter-subscribe]
enabled = true
verify_jwt = false
import_map = "./functions/newsletter-subscribe/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/newsletter-subscribe/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/newsletter-subscribe/*.html" ]

[functions.unsubscribe]
enabled = true
verify_jwt = false
import_map = "./functions/unsubscribe/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/unsubscribe/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/unsubscribe/*.html" ]

[functions.send-contact-message]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-contact-message/index.ts"

[functions.paystack-webhook]
enabled = true
# Paystack cannot send a Supabase JWT; the request is authenticated by its
# HMAC signature inside the function instead.
verify_jwt = false
entrypoint = "./functions/paystack-webhook/index.ts"

[functions.shipping-cancel]
enabled = true
verify_jwt = true
entrypoint = "./functions/shipping-cancel/index.ts"
